<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="476" viewBox="0 0 1600 476" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">The Business Critical route</title><desc id="diagram-desc">The same five phases, and what each one asks for when the work is Business Critical</desc><rect width="1600" height="476" fill="#FFFFFF"/><rect x="0" y="0" width="1600" height="476" fill="#FFFFFF"/><g opacity="1"><rect x="40" y="28" width="1520" height="26" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(40,28)"><foreignObject x="0" y="0" width="1520" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:flex-start;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><b style="font-size:20px;color:#003087">The Business Critical route</b></div></div></foreignObject></g></g><g opacity="1"><rect x="40" y="54" width="1520" height="34" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(40,54)"><foreignObject x="0" y="0" width="1520" height="34"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:flex-start;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><span style="font-size:12px;color:#425563">The same five phases, and what each one asks for when the work is Business Critical</span></div></div></foreignObject></g></g><g opacity="1"><rect x="40" y="136" width="286" height="140" rx="6" fill="#DCE7F5" stroke="#005EB8" stroke-width="1"/><g transform="translate(40,136)"><foreignObject x="0" y="0" width="286" height="140"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 14px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center"><b style="font-size:10px;color:#003087;letter-spacing:0.8px">PHASE 1</b><br/><b style="font-size:15px;color:#003087">Engagement and scoping</b><br/><span style="font-size:11px;color:#231F20">Decide it, name who is accountable, and get it on the register.</span></div></div></div></foreignObject></g></g><g opacity="1"><rect x="348" y="136" width="286" height="140" rx="6" fill="#DCE7F5" stroke="#005EB8" stroke-width="1"/><g transform="translate(348,136)"><foreignObject x="0" y="0" width="286" height="140"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 14px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center"><b style="font-size:10px;color:#003087;letter-spacing:0.8px">PHASE 2</b><br/><b style="font-size:15px;color:#003087">Design</b><br/><span style="font-size:11px;color:#231F20">Plan what Level 4 BCA asks for, and the documentation it needs.</span></div></div></div></foreignObject></g></g><g opacity="1"><rect x="656" y="136" width="286" height="140" rx="6" fill="#DCE7F5" stroke="#005EB8" stroke-width="1"/><g transform="translate(656,136)"><foreignObject x="0" y="0" width="286" height="140"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 14px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center"><b style="font-size:10px;color:#003087;letter-spacing:0.8px">PHASE 3</b><br/><b style="font-size:15px;color:#003087">Analysis</b><br/><span style="font-size:11px;color:#231F20">Do the work to the enhanced standard, and document the uncertainty.</span></div></div></div></foreignObject></g></g><g opacity="1"><rect x="964" y="136" width="286" height="140" rx="6" fill="#DCE7F5" stroke="#005EB8" stroke-width="1"/><g transform="translate(964,136)"><foreignObject x="0" y="0" width="286" height="140"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 14px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center"><b style="font-size:10px;color:#003087;letter-spacing:0.8px">PHASE 4</b><br/><b style="font-size:15px;color:#003087">Delivery and sign-off</b><br/><span style="font-size:11px;color:#231F20">Publish the quality assurance statement, and get it approved.</span></div></div></div></foreignObject></g></g><g opacity="1"><rect x="1272" y="136" width="286" height="140" rx="6" fill="#DCE7F5" stroke="#005EB8" stroke-width="1"/><g transform="translate(1272,136)"><foreignObject x="0" y="0" width="286" height="140"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 14px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center"><b style="font-size:10px;color:#003087;letter-spacing:0.8px">PHASE 5</b><br/><b style="font-size:15px;color:#003087">Review</b><br/><span style="font-size:11px;color:#231F20">Set a review date, and revalidate the designation.</span></div></div></div></foreignObject></g></g><g opacity="1"><rect x="40" y="290" width="1520" height="44" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(40,290)"><foreignObject x="0" y="0" width="1520" height="44"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 8px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center"><span style="font-size:11px;color:#425563">The designation is settled at scoping, and it is settled once.</span></div></div></div></foreignObject></g></g><g opacity="1"><rect x="40" y="346" width="1520" height="78" rx="6" fill="#E8EDEE" stroke="#005EB8" stroke-width="1"/><g transform="translate(40,346)"></g></g><g opacity="1"><rect x="64" y="360" width="1472" height="20" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(64,360)"><foreignObject x="0" y="0" width="1472" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:flex-start;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><b style="font-size:11px;color:#003087;letter-spacing:0.4px">NOT A SEPARATE PROCESS</b></div></div></foreignObject></g></g><g opacity="1"><rect x="64" y="386" width="1472" height="30" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(64,386)"><foreignObject x="0" y="0" width="1472" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:flex-start;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><span style="font-size:12px;color:#231F20">Business Critical work runs through the same five phases, and raises what each one asks for.</span></div></div></foreignObject></g></g><g opacity="1"><path d="M 326 206 L 326 206 L 348 206 L 348 206" fill="none" stroke="#003087" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 348 206 L 334 211.88 L 334 200.12 Z" fill="#003087"/></g><g opacity="1"><path d="M 634 206 L 634 206 L 656 206 L 656 206" fill="none" stroke="#003087" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 656 206 L 642 211.88 L 642 200.12 Z" fill="#003087"/></g><g opacity="1"><path d="M 942 206 L 942 206 L 964 206 L 964 206" fill="none" stroke="#003087" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 964 206 L 950 211.88 L 950 200.12 Z" fill="#003087"/></g><g opacity="1"><path d="M 1250 206 L 1250 206 L 1272 206 L 1272 206" fill="none" stroke="#003087" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1272 206 L 1258 211.88 L 1258 200.12 Z" fill="#003087"/></g></svg>