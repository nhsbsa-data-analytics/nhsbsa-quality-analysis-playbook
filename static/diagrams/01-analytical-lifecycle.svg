<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 516" xml:lang="en-GB" lang="en-GB" role="img" aria-labelledby="diagram-title" aria-describedby="diagram-desc"><title id="diagram-title">The analytical lifecycle</title><desc id="diagram-desc">Five phases drawn as a circuit, read clockwise, each in a filled box. Phases 1, 2 and 3 run left to right across the top. An arrow comes down the right-hand side to Phase 4. An arrow runs back along the bottom to Phase 5. A green arrow goes up the left-hand side from Phase 5 to Phase 1, closing the loop, and is marked: lessons go into the next scoping. Phase 1 is engagement and scoping, phase 2 design, phase 3 analysis, phase 4 delivery, communication and sign-off, and phase 5 review. Phase 5 is green and the other four are blue. A panel below is headed running through all five phases, and reads: quality assurance and customer and stakeholder engagement.</desc><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description><dc:title>The analytical lifecycle</dc:title><dc:creator>Seamus Sands</dc:creator><dc:publisher>NHSBSA</dc:publisher><dc:language>en-GB</dc:language></rdf:Description></rdf:RDF></metadata><rect width="680" height="516" fill="#FFFFFF"/><rect x="0" y="0" width="680" height="516" fill="#FFFFFF"/><g opacity="1"><rect x="24" y="22" width="632" height="32" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(24,22)"><foreignObject overflow="visible" x="0" y="0" width="632" height="32"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:flex-start;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><div style="text-align:center"><b style="font-size:20px;color:#003087">The analytical lifecycle</b></div></div></div