<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 720" xml:lang="en-GB" lang="en-GB" role="img" aria-labelledby="diagram-title" aria-describedby="diagram-desc"><title id="diagram-title">The analytical lifecycle</title><desc id="diagram-desc">Five phases drawn as a circuit, read clockwise, each in a filled box with a line saying what happens in it, as listed under the picture. Phases 1, 2 and 3 run left to right across the top. An arrow comes down the right-hand side to Phase 4. An arrow runs back along the bottom to Phase 5. A dashed green arrow goes up the left-hand side from Phase 5 to Phase 1, closing the loop, and is marked: lessons go into the next scoping. Phase 1 is engagement and scoping, phase 2 design, phase 3 analysis, phase 4 delivery, communication and sign-off, and phase 5 review. Phase 5 is green and the other four are blue. A panel below is headed running through all five phases, and reads: quality assurance and customer and stakeholder engagement.</desc><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description><dc:title>The analytical lifecycle</dc:title><dc:creator>Seamus Sands</dc:creator><dc:publisher>NHSBSA</dc:publisher><dc:language>en-GB</dc:language></rdf:Description></rdf:RDF></metadata><rect width="680" height="720" fill="#F0F4F5"/><rect x="0" y="0" width="680" height="720" fill="#F0F4F5"/><g opacity="1"><rect x="24" y="22" width="632" height="32" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(24,22)"><foreignObject overflow="visible" x="0" y="0" width="632" height="32"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:flex-start;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><div style="text-align:center"><b style="font-size:20px;color:#003087">The analytical lifecycle</b></div></div></div></foreignObject></g></g><g opacity="1"><rect x="24" y="84" width="190" height="214" rx="6" fill="#2556A5" stroke="#2556A5" stroke-width="2"/><g transform="translate(24,84)"><foreignObject overflow="visible" x="0" y="0" width="190" height="214"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 14px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center;text-wrap:balance"><b style="font-size:14px;color:#FFFFFF;letter-spacing:0.8px">PHASE 1</b><br/><b style="font-size:16px;color:#FFFFFF">Engagement and scoping</b><br/><span style="font-size:16px;color:#FFFFFF">Define the requirement, intended use and impact of the analysis.</span></div></div></div></foreignObject></g></g><g opacity="1"><rect x="25" y="85" width="188" height="5" rx="0" fill="#E8B13A" stroke="none" stroke-width="1"/><g transform="translate(25,85)"></g></g><g opacity="1"><rect x="245" y="84" width="190" height="214" rx="6" fill="#2556A5" stroke="#2556A5" stroke-width="2"/><g transform="translate(245,84)"><foreignObject overflow="visible" x="0" y="0" width="190" height="214"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 14px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center;text-wrap:balance"><b style="font-size:14px;color:#FFFFFF;letter-spacing:0.8px">PHASE 2</b><br/><b style="font-size:16px;color:#FFFFFF">Design</b><br/><span style="font-size:16px;color:#FFFFFF">Select the most appropriate analytical approach and plan assurance activities.</span></div></div></div></foreignObject></g></g><g opacity="1"><rect x="246" y="85" width="188" height="5" rx="0" fill="#E8B13A" stroke="none" stroke-width="1"/><g transform="translate(246,85)"></g></g><g opacity="1"><rect x="466" y="84" width="190" height="214" rx="6" fill="#2556A5" stroke="#2556A5" stroke-width="2"/><g transform="translate(466,84)"><foreignObject overflow="visible" x="0" y="0" width="190" height="214"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 14px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center;text-wrap:balance"><b style="font-size:14px;color:#FFFFFF;letter-spacing:0.8px">PHASE 3</b><br/><b style="font-size:16px;color:#FFFFFF">Analysis</b><br/><span style="font-size:16px;color:#FFFFFF">Produce, document and assure the analysis.</span></div></div></div></foreignObject></g></g><g opacity="1"><rect x="467" y="85" width="188" height="5" rx="0" fill="#E8B13A" stroke="none" stroke-width="1"/><g transform="translate(467,85)"></g></g><g opacity="1"><rect x="466" y="354" width="190" height="214" rx="6" fill="#2556A5" stroke="#2556A5" stroke-width="2"/><g transform="translate(466,354)"><foreignObject overflow="visible" x="0" y="0" width="190" height="214"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 14px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center;text-wrap:balance"><b style="font-size:14px;color:#FFFFFF;letter-spacing:0.8px">PHASE 4</b><br/><b style="font-size:16px;color:#FFFFFF">Delivery, communication and sign&#8209;off</b><br/><span style="font-size:16px;color:#FFFFFF">Communicate findings, limitations and assurance outcomes.</span></div></div></div></foreignObject></g></g><g opacity="1"><rect x="467" y="355" width="188" height="5" rx="0" fill="#E8B13A" stroke="none" stroke-width="1"/><g transform="translate(467,355)"></g></g><g opacity="1"><rect x="24" y="354" width="190" height="214" rx="6" fill="#006232" stroke="#006232" stroke-width="2"/><g transform="translate(24,354)"><foreignObject overflow="visible" x="0" y="0" width="190" height="214"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 14px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center;text-wrap:balance"><b style="font-size:14px;color:#FFFFFF;letter-spacing:0.8px">PHASE 5</b><br/><b style="font-size:16px;color:#FFFFFF">Review</b><br/><span style="font-size:16px;color:#FFFFFF">Evaluate the effectiveness of the analysis and identify lessons learned.</span></div></div></div></foreignObject></g></g><g opacity="1"><rect x="25" y="355" width="188" height="5" rx="0" fill="#E8B13A" stroke="none" stroke-width="1"/><g transform="translate(25,355)"></g></g><g opacity="1"><rect x="24" y="608" width="632" height="96" rx="6" fill="#003087" stroke="#003087" stroke-width="1"/><g transform="translate(24,608)"></g></g><g opacity="1"><rect x="46" y="620" width="588" height="22" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(46,620)"><foreignObject overflow="visible" x="0" y="0" width="588" height="22"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:flex-start;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><b style="font-size:14px;color:#FFFFFF;letter-spacing:0.6px">RUNNING THROUGH ALL FIVE PHASES</b></div></div></foreignObject></g></g><g opacity="1"><rect x="46" y="648" width="588" height="48" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(46,648)"><foreignObject overflow="visible" x="0" y="0" width="588" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:flex-start;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><span style="font-size:16px;color:#FFFFFF"><b>Quality assurance</b> and <b>customer and stakeholder engagement</b>.</span></div></div></foreignObject></g></g><g opacity="1"><path d="M 214 191 L 214 191 L 245 191 L 245 191" fill="none" stroke="#425563" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 245 191 L 231 196.88 L 231 185.12 Z" fill="#425563"/></g><g opacity="1"><path d="M 435 191 L 435 191 L 466 191 L 466 191" fill="none" stroke="#425563" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 466 191 L 452 196.88 L 452 185.12 Z" fill="#425563"/></g><g opacity="1"><path d="M 561 298 L 561 326 L 561 326 L 561 354" fill="none" stroke="#425563" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 561 354 L 555.12 340 L 566.88 340 Z" fill="#425563"/></g><g opacity="1"><path d="M 466 461 L 466 461 L 214 461 L 214 461" fill="none" stroke="#425563" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 214 461 L 228 455.12 L 228 466.88 Z" fill="#425563"/></g><g opacity="1"><path d="M 185.5 354 L 185.5 326 L 185.5 326 L 185.5 298" fill="none" stroke="#006232" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><path d="M 185.5 298 L 191.38 312 L 179.62 312 Z" fill="#006232"/></g><g transform="translate(19.78,312.4)"><rect x="0" y="0" width="331.44" height="27.2" rx="3" fill="#F0F4F5"/><foreignObject overflow="visible" x="0" y="0" width="331.44" height="27.2"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:16px;color:#3B4A55;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;font-weight:700;">Lessons go into the next scoping</div></div></foreignObject></g></svg>