<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="412" viewBox="0 0 1600 412" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">The short path</title><desc id="diagram-desc">Three steps. What most analysis needs, and nothing else.</desc><rect width="1600" height="412" fill="#FFFFFF"/><rect x="0" y="0" width="1600" height="412" fill="#FFFFFF"/><g opacity="1"><rect x="40" y="28" width="1520" height="26" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(40,28)"><foreignObject x="0" y="0" width="1520" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:flex-start;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><b style="font-size:20px;color:#003087">The short path</b></div></div></foreignObject></g></g><g opacity="1"><rect x="40" y="54" width="1520" height="34" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(40,54)"><foreignObject x="0" y="0" width="1520" height="34"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:flex-start;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><span style="font-size:12px;color:#425563">Three steps. What most analysis needs, and nothing else.</span></div></div></foreignObject></g></g><g opacity="1"><rect x="40" y="130" width="480" height="112" rx="6" fill="#DCE7F5" stroke="#005EB8" stroke-width="1"/><g transform="translate(40,130)"><foreignObject x="0" y="0" width="480" height="112"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 14px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center"><b style="font-size:10px;color:#003087;letter-spacing:0.8px">PHASE 1</b><br/><b style="font-size:15px;color:#003087">Agree the question</b><br/><span style="font-size:11px;color:#231F20">Agree with your commissioner what decision it informs.</span></div></div></div></foreignObject></g></g><g opacity="1"><rect x="560" y="130" width="480" height="112" rx="6" fill="#DCE7F5" stroke="#005EB8" stroke-width="1"/><g transform="translate(560,130)"><foreignObject x="0" y="0" width="480" height="112"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 14px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center"><b style="font-size:10px;color:#003087;letter-spacing:0.8px">PHASE 1</b><br/><b style="font-size:15px;color:#003087">Decide your assurance level</b><br/><span style="font-size:11px;color:#231F20">Score the impact and the likelihood. About five minutes.</span></div></div></div></foreignObject></g></g><g opacity="1"><rect x="1080" y="130" width="480" height="112" rx="6" fill="#DCE7F5" stroke="#005EB8" stroke-width="1"/><g transform="translate(1080,130)"><foreignObject x="0" y="0" width="480" height="112"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 14px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center"><b style="font-size:10px;color:#003087;letter-spacing:0.8px">PHASES 2 TO 4</b><br/><b style="font-size:15px;color:#003087">Do what that level requires</b><br/><span style="font-size:11px;color:#231F20">Read the column for your level.</span></div></div></div></foreignObject></g></g><g opacity="1"><rect x="40" y="282" width="1520" height="78" rx="6" fill="#E8EDEE" stroke="#005EB8" stroke-width="1"/><g transform="translate(40,282)"></g></g><g opacity="1"><rect x="64" y="296" width="1472" height="20" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(64,296)"><foreignObject x="0" y="0" width="1472" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:flex-start;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><b style="font-size:11px;color:#003087;letter-spacing:0.4px">AND THAT IS MOST WORK</b></div></div></foreignObject></g></g><g opacity="1"><rect x="64" y="322" width="1472" height="30" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(64,322)"><foreignObject x="0" y="0" width="1472" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:flex-start;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><span style="font-size:12px;color:#231F20">Everything else here answers a question these three raise.</span></div></div></foreignObject></g></g><g opacity="1"><path d="M 520 186 L 520 186 L 560 186 L 560 186" fill="none" stroke="#003087" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 560 186 L 546 191.88 L 546 180.12 Z" fill="#003087"/></g><g opacity="1"><path d="M 1040 186 L 1040 186 L 1080 186 L 1080 186" fill="none" stroke="#003087" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1080 186 L 1066 191.88 L 1066 180.12 Z" fill="#003087"/></g></svg>