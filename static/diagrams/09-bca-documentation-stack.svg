<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">Who owns the Business Critical documentation</title><desc id="diagram-desc">The four roles, and what each one owns in the stack of eleven documents</desc><rect width="1600" height="460" fill="#FFFFFF"/><rect x="0" y="0" width="1600" height="460" fill="#FFFFFF"/><g opacity="1"><rect x="40" y="28" width="1520" height="26" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(40,28)"><foreignObject x="0" y="0" width="1520" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:flex-start;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><b style="font-size:20px;color:#003087">Who owns the Business Critical documentation</b></div></div></foreignObject></g></g><g opacity="1"><rect x="40" y="54" width="1520" height="34" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(40,54)"><foreignObject x="0" y="0" width="1520" height="34"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:flex-start;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><span style="font-size:12px;color:#425563">The four roles, and what each one owns in the stack of eleven documents</span></div></div></foreignObject></g></g><g opacity="1"><rect x="40" y="136" width="359" height="120" rx="6" fill="#DCE7F5" stroke="#005EB8" stroke-width="1"/><g transform="translate(40,136)"><foreignObject x="0" y="0" width="359" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 10px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center"><b style="font-size:10px;color:#003087;letter-spacing:0.8px">DOES THE WORK</b><br/><b style="font-size:15px;color:#003087">The analyst</b><br/><span style="font-size:11px;color:#231F20">Writes the scope, the specification, the model and both guides.</span></div></div></div></foreignObject></g></g><g opacity="1"><rect x="427" y="136" width="359" height="120" rx="6" fill="#DCE7F5" stroke="#005EB8" stroke-width="1"/><g transform="translate(427,136)"><foreignObject x="0" y="0" width="359" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 10px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center"><b style="font-size:10px;color:#003087;letter-spacing:0.8px">ALSO THE LEAD ASSURER</b><br/><b style="font-size:15px;color:#003087">The critical friend</b><br/><span style="font-size:11px;color:#231F20">Reviews it, and signs the assurance review and the sign-off.</span></div></div></div></foreignObject></g></g><g opacity="1"><rect x="814" y="136" width="359" height="120" rx="6" fill="#DCE7F5" stroke="#005EB8" stroke-width="1"/><g transform="translate(814,136)"><foreignObject x="0" y="0" width="359" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 10px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center"><b style="font-size:10px;color:#003087;letter-spacing:0.8px">OWNS THE DECISION</b><br/><b style="font-size:15px;color:#003087">The commissioner</b><br/><span style="font-size:11px;color:#231F20">Agrees the assurance level decision sheet with the analyst.</span></div></div></div></foreignObject></g></g><g opacity="1"><rect x="1201" y="136" width="359" height="120" rx="6" fill="#DCE7F5" stroke="#005EB8" stroke-width="1"/><g transform="translate(1201,136)"><foreignObject x="0" y="0" width="359" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 10px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center"><b style="font-size:10px;color:#003087;letter-spacing:0.8px">APPROVES IT</b><br/><b style="font-size:15px;color:#003087">The Analysis Senior Responsible Officer</b><br/><span style="font-size:11px;color:#231F20">Confirms it is fit for its intended use, last of all.</span></div></div></div></foreignObject></g></g><g opacity="1"><rect x="40" y="274" width="1520" height="44" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(40,274)"><foreignObject x="0" y="0" width="1520" height="44"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 8px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center"><span style="font-size:11px;color:#425563">Most of the eleven documents are the analyst's, and assurance comes at the end.</span></div></div></div></foreignObject></g></g><g opacity="1"><rect x="40" y="330" width="1520" height="78" rx="6" fill="#E8EDEE" stroke="#005EB8" stroke-width="1"/><g transform="translate(40,330)"></g></g><g opacity="1"><rect x="64" y="344" width="1472" height="20" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(64,344)"><foreignObject x="0" y="0" width="1472" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:flex-start;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><b style="font-size:11px;color:#003087;letter-spacing:0.4px">SIGN-OFF IS NOT THE END OF IT</b></div></div></foreignObject></g></g><g opacity="1"><rect x="64" y="370" width="1472" height="30" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(64,370)"><foreignObject x="0" y="0" width="1472" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:flex-start;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><span style="font-size:12px;color:#231F20">Quality assurance carries on after approval, and a material change sends the stack back for review.</span></div></div></foreignObject></g></g></svg>