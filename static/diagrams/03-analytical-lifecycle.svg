<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="612" viewBox="0 0 1600 612" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">The analytical lifecycle: five phases</title><desc id="diagram-desc">Phases 1 to 4 are the AQuA Book stages. Phase 5 closes the loop back to Phase 1.</desc><rect width="1600" height="612" fill="#FFFFFF"/><rect x="0" y="0" width="1600" height="612" fill="#FFFFFF"/><g opacity="1"><rect x="40" y="28" width="1520" height="26" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(40,28)"><foreignObject x="0" y="0" width="1520" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:flex-start;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><b style="font-size:20px;color:#003087">The analytical lifecycle: five phases</b></div></div></foreignObject></g></g><g opacity="1"><rect x="40" y="54" width="1520" height="34" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(40,54)"><foreignObject x="0" y="0" width="1520" height="34"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:flex-start;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><span style="font-size:12px;color:#425563">Phases 1 to 4 are the AQuA Book stages. Phase 5 closes the loop back to Phase 1.</span></div></div></foreignObject></g></g><g opacity="1"><rect x="40" y="130" width="470" height="92" rx="6" fill="#DCE7F5" stroke="#005EB8" stroke-width="1"/><g transform="translate(40,130)"><foreignObject x="0" y="0" width="470" height="92"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 14px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center"><b style="font-size:10px;color:#003087;letter-spacing:0.8px">PHASE 1</b><br/><b style="font-size:15px;color:#003087">Engagement and scoping</b><br/><span style="font-size:11px;color:#231F20">Agree the question, the decision it informs, and the assurance level.</span></div></div></div></foreignObject></g></g><g opacity="1"><rect x="565" y="130" width="470" height="92" rx="6" fill="#DCE7F5" stroke="#005EB8" stroke-width="1"/><g transform="translate(565,130)"><foreignObject x="0" y="0" width="470" height="92"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 14px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center"><b style="font-size:10px;color:#003087;letter-spacing:0.8px">PHASE 2</b><br/><b style="font-size:15px;color:#003087">Design</b><br/><span style="font-size:11px;color:#231F20">Choose the method, and plan the assurance the level asks for.</span></div></div></div></foreignObject></g></g><g opacity="1"><rect x="1090" y="130" width="470" height="92" rx="6" fill="#DCE7F5" stroke="#005EB8" stroke-width="1"/><g transform="translate(1090,130)"><foreignObject x="0" y="0" width="470" height="92"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 14px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center"><b style="font-size:10px;color:#003087;letter-spacing:0.8px">PHASE 3</b><br/><b style="font-size:15px;color:#003087">Analysis</b><br/><span style="font-size:11px;color:#231F20">Do the work, check it, and have it reviewed.</span></div></div></div></foreignObject></g></g><g opacity="1"><rect x="1090" y="300" width="470" height="92" rx="6" fill="#DCE7F5" stroke="#005EB8" stroke-width="1"/><g transform="translate(1090,300)"><foreignObject x="0" y="0" width="470" height="92"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 14px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center"><b style="font-size:10px;color:#003087;letter-spacing:0.8px">PHASE 4</b><br/><b style="font-size:15px;color:#003087">Delivery and sign-off</b><br/><span style="font-size:11px;color:#231F20">Hand it over with its caveats, and get it approved.</span></div></div></div></foreignObject></g></g><g opacity="1"><rect x="40" y="300" width="470" height="92" rx="6" fill="#DCEFE4" stroke="#007F3B" stroke-width="1"/><g transform="translate(40,300)"><foreignObject x="0" y="0" width="470" height="92"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 14px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center"><b style="font-size:10px;color:#003087;letter-spacing:0.8px">PHASE 5</b><br/><b style="font-size:15px;color:#003087">Review</b><br/><span style="font-size:11px;color:#231F20">Ask whether it worked, and whether it is still right.</span></div></div></div></foreignObject></g></g><g opacity="1"><rect x="565" y="324" width="470" height="44" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(565,324)"><foreignObject x="0" y="0" width="470" height="44"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 8px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center"><span style="font-size:11px;color:#425563">What Phase 5 finds is what the next piece of work starts from.</span></div></div></div></foreignObject></g></g><g opacity="1"><rect x="40" y="494" width="1520" height="78" rx="6" fill="#E8EDEE" stroke="#005EB8" stroke-width="1"/><g transform="translate(40,494)"></g></g><g opacity="1"><rect x="64" y="508" width="1472" height="20" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(64,508)"><foreignObject x="0" y="0" width="1472" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:flex-start;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><b style="font-size:11px;color:#003087;letter-spacing:0.4px">RUNNING THROUGH ALL FIVE</b></div></div></foreignObject></g></g><g opacity="1"><rect x="64" y="534" width="1472" height="30" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(64,534)"><foreignObject x="0" y="0" width="1472" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:flex-start;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><span style="font-size:12px;color:#231F20"><b>Quality assurance</b>, and <b>customer and stakeholder engagement</b>. Neither is a phase. Both run from Phase 1 to Phase 5.</span></div></div></foreignObject></g></g><g opacity="1"><path d="M 510 176 L 510 176 L 565 176 L 565 176" fill="none" stroke="#003087" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 565 176 L 551 181.88 L 551 170.12 Z" fill="#003087"/></g><g opacity="1"><path d="M 1035 176 L 1035 176 L 1090 176 L 1090 176" fill="none" stroke="#003087" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1090 176 L 1076 181.88 L 1076 170.12 Z" fill="#003087"/></g><g opacity="1"><path d="M 1325 222 L 1325 261 L 1325 261 L 1325 300" fill="none" stroke="#003087" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1325 300 L 1319.12 286 L 1330.88 286 Z" fill="#003087"/></g><g opacity="1"><path d="M 1325 392 L 1325 432 Q 1325 440 1317 440 L 283 440 Q 275 440 275 432 L 275 392" fill="none" stroke="#003087" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 275 392 L 280.88 406 L 269.12 406 Z" fill="#003087"/></g><g opacity="1"><path d="M 275 300 L 275 261 L 275 261 L 275 222" fill="none" stroke="#007F3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 275 222 L 280.88 236 L 269.12 236 Z" fill="#007F3B"/></g></svg>