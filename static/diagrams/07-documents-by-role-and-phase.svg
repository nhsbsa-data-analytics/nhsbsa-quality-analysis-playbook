<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 898" xml:lang="en-GB" lang="en-GB" role="img" aria-labelledby="diagram-title" aria-describedby="diagram-desc"><title id="diagram-title">Who owns each document, and when</title><desc id="diagram-desc">A grid with a lane for each role and a column for each of four phases. The phases run across the top: engagement and scoping, design, analysis, and delivery, communication and sign-off. Each lane is a pale block with the role&#x27;s name, and a rule separates one lane from the next. The commissioner lane holds one document, in engagement and scoping: 3, the Analytical Assurance Decision Tool, which the commissioner completes with the analyst. The analyst lane holds eight. In engagement and scoping: 1, the analytical plan, or the team&#x27;s own version, and 2, the scope. In design: 4, the specification, 5, the quality assurance plan, and 6, the quality assurance appraisal, basic information. In analysis: 7, the analysis or model itself, 8, the technical guide, and 9, the user guide. In delivery, communication and sign-off the lane for the critical friend, as Lead Assurer, holds 10, the quality assurance appraisal, assurance review. An arrow goes down from it to 11, the quality assurance sign-off, which is drawn across the lane of the critical friend and the lane of the Analysis Senior Responsible Officer below it, because the critical friend signs off first and then the officer.</desc><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description><dc:title>Who owns each document, and when</dc:title><dc:creator>Seamus Sands</dc:creator><dc:publisher>NHSBSA</dc:publisher><dc:language>en-GB</dc:language></rdf:Description></rdf:RDF></metadata><rect width="680" height="898" fill="#FFFFFF"/><rect x="0" y="0" width="680" height="898" fill="#FFFFFF"/><g opacity="1"><rect x="24" y="22" width="632" height="32" rx="0" fill="none" stroke="none" stroke-wi