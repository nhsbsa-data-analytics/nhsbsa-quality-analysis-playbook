<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 530" xml:lang="en-GB" lang="en-GB" role="img" aria-labelledby="diagram-title" aria-describedby="diagram-desc"><title id="diagram-title">What changes as the level rises</title><desc id="diagram-desc">A grid with the four assurance levels across the top and three rows down the side. Signs it off: Level 1, you; Level 2, your team lead; Level 3, lead Official for Statistics; Level 4, lead Assurer, then the Analysis Senior Responsible Officer. Reviews it: Level 1, a colleague in your team; Level 2, someone with no hand in the work; Level 3, an assurer from outside the team; Level 4, a Lead Assurer, and external review. Ends with: Level 1, record stored with the output; Level 2, archived, and linked from the output; Level 3, published with its statement; Level 4, published, registered, revalidated annually.</desc><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description><dc:title>What changes as the level rises</dc:title><dc:creator>Seamus Sands</dc:creator><dc:publisher>NHSBSA</dc:publisher><dc:language>en-GB</dc:language></rdf:Description></rdf:RDF></metadata><rect width="680" height="530" fill="#FFFFFF"/><rect x="0" y="0" width="680" height="530" fill="#FFFFFF"/><g opacity="1"><rect x="24" y="22" width="632" height="32" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(24,22)"><foreignObject overflow="visible" x="0" y="0" width="632" height="32"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:flex-start;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><div style="text-align:center"><b style="font-size:20px;color:#003087">What changes as the level rises</b></div></div></div></foreignObject></g></g><g 