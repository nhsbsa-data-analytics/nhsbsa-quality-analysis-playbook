<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="812" viewBox="0 0 1600 812" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">How far the reviewer sits from the work</title><desc id="diagram-desc">Four nested bands. The further out the band, the further the reviewer sits.</desc><rect width="1600" height="812" fill="#FFFFFF"/><rect x="0" y="0" width="1600" height="812" fill="#FFFFFF"/><g opacity="1"><rect x="40" y="28" width="1520" height="26" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(40,28)"><foreignObject x="0" y="0" width="1520" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:flex-start;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><b style="font-size:20px;color:#003087">How far the reviewer sits from the work</b></div></div></foreignObject></g></g><g opacity="1"><rect x="40" y="54" width="1520" height="34" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(40,54)"><foreignObject x="0" y="0" width="1520" height="34"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:flex-start;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><span style="font-size:12px;color:#425563">Four nested bands. The further out the band, the further the reviewer sits.</span></div></div></foreignObject></g></g><g opacity="1"><rect x="40" y="118" width="1520" height="560" rx="6" fill="#BFCCD1" stroke="#768692" stroke-width="1"/><g transform="translate(40,118)"></g></g><g opacity="1"><rect x="60" y="130" width="1480" height="26" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(60,130)"><foreignObject x="0" y="0" width="1480" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:flex-start;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><b style="font-size:13px;color:#003087">Level 4 BCA</b>&#160;&#160;<span style="font-size:11px;color:#231F20">A Lead Assurer from outside the delivering team, with external review.</span></div></div></foreignObject></g></g><g opacity="1"><rect x="126" y="176" width="1348" height="444" rx="6" fill="#D5DEE1" stroke="#768692" stroke-width="1"/><g transform="translate(126,176)"></g></g><g opacity="1"><rect x="146" y="188" width="1308" height="26" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(146,188)"><foreignObject x="0" y="0" width="1308" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:flex-start;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><b style="font-size:13px;color:#003087">Level 3 Comprehensive</b>&#160;&#160;<span style="font-size:11px;color:#231F20">An assurer from outside the delivering team.</span></div></div></foreignObject></g></g><g opacity="1"><rect x="212" y="234" width="1176" height="328" rx="6" fill="#E8EDEE" stroke="#768692" stroke-width="1"/><g transform="translate(212,234)"></g></g><g opacity="1"><rect x="232" y="246" width="1136" height="26" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(232,246)"><foreignObject x="0" y="0" width="1136" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:flex-start;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><b style="font-size:13px;color:#003087">Level 2 Enhanced</b>&#160;&#160;<span style="font-size:11px;color:#231F20">Someone who had no hand in producing the work.</span></div></div></foreignObject></g></g><g opacity="1"><rect x="298" y="292" width="1004" height="212" rx="6" fill="#F4F7F8" stroke="#768692" stroke-width="1"/><g transform="translate(298,292)"></g></g><g opacity="1"><rect x="318" y="304" width="964" height="26" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(318,304)"><foreignObject x="0" y="0" width="964" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:flex-start;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><b style="font-size:13px;color:#003087">Level 1 Standard</b>&#160;&#160;<span style="font-size:11px;color:#231F20">A colleague, within your team.</span></div></div></foreignObject></g></g><g opacity="1"><rect x="650" y="372" width="300" height="52" rx="6" fill="#005EB8" stroke="#003087" stroke-width="1"/><g transform="translate(650,372)"><foreignObject x="0" y="0" width="300" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 14px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><b style="font-size:13px;color:#FFFFFF">THE WORK</b></div></div></foreignObject></g></g><g opacity="1"><rect x="40" y="700" width="1520" height="78" rx="6" fill="#E8EDEE" stroke="#005EB8" stroke-width="1"/><g transform="translate(40,700)"></g></g><g opacity="1"><rect x="64" y="714" width="1472" height="20" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(64,714)"><foreignObject x="0" y="0" width="1472" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:flex-start;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><b style="font-size:11px;color:#003087;letter-spacing:0.4px">TRUE AT EVERY LEVEL</b></div></div></foreignObject></g></g><g opacity="1"><rect x="64" y="740" width="1472" height="30" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(64,740)"><foreignObject x="0" y="0" width="1472" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:flex-start;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><span style="font-size:12px;color:#231F20">Somebody independent looks at the work at every level, and your own checks come first.</span></div></div></foreignObject></g></g></svg>