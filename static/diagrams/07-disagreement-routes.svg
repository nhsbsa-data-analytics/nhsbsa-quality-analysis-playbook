<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="456" viewBox="0 0 1600 456" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">Where a disagreement goes</title><desc id="diagram-desc">Five disagreements, where each one starts, and where it goes if it is not settled</desc><rect width="1600" height="456" fill="#FFFFFF"/><rect x="0" y="0" width="1600" height="456" fill="#FFFFFF"/><g opacity="1"><rect x="40" y="28" width="1520" height="26" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(40,28)"><foreignObject x="0" y="0" width="1520" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:flex-start;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><b style="font-size:20px;color:#003087">Where a disagreement goes</b></div></div></foreignObject></g></g><g opacity="1"><rect x="40" y="54" width="1520" height="34" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(40,54)"><foreignObject x="0" y="0" width="1520" height="34"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:flex-start;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><span style="font-size:12px;color:#425563">Five disagreements, where each one starts, and where it goes if it is not settled</span></div></div></foreignObject></g></g><g opacity="1"><rect x="40" y="136" width="286" height="120" rx="6" fill="#DCE7F5" stroke="#005EB8" stroke-width="1"/><g transform="translate(40,136)"><foreignObject x="0" y="0" width="286" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 10px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center"><b style="font-size:10px;color:#003087;letter-spacing:0.8px">NO FIRST STEP</b><br/><b style="font-size:15px;color:#003087">The assurance level</b><br/><span style="font-size:11px;color:#231F20">Goes to the Analytical Quality and Assurance Lead.</span></div></div></div></foreignObject></g></g><g opacity="1"><rect x="348" y="136" width="286" height="120" rx="6" fill="#DCE7F5" stroke="#005EB8" stroke-width="1"/><g transform="translate(348,136)"><foreignObject x="0" y="0" width="286" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 10px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center"><b style="font-size:10px;color:#003087;letter-spacing:0.8px">THE COMMISSIONER FIRST</b><br/><b style="font-size:15px;color:#003087">Is it Business Critical?</b><br/><span style="font-size:11px;color:#231F20">Then the Analytical Quality and Assurance Lead.</span></div></div></div></foreignObject></g></g><g opacity="1"><rect x="656" y="136" width="286" height="120" rx="6" fill="#DCE7F5" stroke="#005EB8" stroke-width="1"/><g transform="translate(656,136)"><foreignObject x="0" y="0" width="286" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 10px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center"><b style="font-size:10px;color:#003087;letter-spacing:0.8px">THE CRITICAL FRIEND FIRST</b><br/><b style="font-size:15px;color:#003087">Is it fit for purpose?</b><br/><span style="font-size:11px;color:#231F20">Then the Head of Profession.</span></div></div></div></foreignObject></g></g><g opacity="1"><rect x="964" y="136" width="286" height="120" rx="6" fill="#DCE7F5" stroke="#005EB8" stroke-width="1"/><g transform="translate(964,136)"><foreignObject x="0" y="0" width="286" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 10px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center"><b style="font-size:10px;color:#003087;letter-spacing:0.8px">THE COMMISSIONER FIRST</b><br/><b style="font-size:15px;color:#003087">Enough time for the assurance?</b><br/><span style="font-size:11px;color:#231F20">Then the Analytical Quality and Assurance Lead.</span></div></div></div></foreignObject></g></g><g opacity="1"><rect x="1272" y="136" width="286" height="120" rx="6" fill="#DCE7F5" stroke="#005EB8" stroke-width="1"/><g transform="translate(1272,136)"><foreignObject x="0" y="0" width="286" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 10px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center"><b style="font-size:10px;color:#003087;letter-spacing:0.8px">THE COMMISSIONER FIRST</b><br/><b style="font-size:15px;color:#003087">An ethical concern</b><br/><span style="font-size:11px;color:#231F20">Then the Analytical Quality and Assurance Lead.</span></div></div></div></foreignObject></g></g><g opacity="1"><rect x="40" y="270" width="1520" height="44" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(40,270)"><foreignObject x="0" y="0" width="1520" height="44"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 8px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center"><span style="font-size:11px;color:#425563">An ethical concern about an official statistic goes to the Head of Profession instead.</span></div></div></div></foreignObject></g></g><g opacity="1"><rect x="40" y="326" width="1520" height="78" rx="6" fill="#E8EDEE" stroke="#005EB8" stroke-width="1"/><g transform="translate(40,326)"></g></g><g opacity="1"><rect x="64" y="340" width="1472" height="20" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(64,340)"><foreignObject x="0" y="0" width="1472" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:flex-start;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><b style="font-size:11px;color:#003087;letter-spacing:0.4px">NOT ON THIS LIST</b></div></div></foreignObject></g></g><g opacity="1"><rect x="64" y="366" width="1472" height="30" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(64,366)"><foreignObject x="0" y="0" width="1472" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:flex-start;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><span style="font-size:12px;color:#231F20">Deadline pressure is not resolved by lowering the assurance level.</span></div></div></foreignObject></g></g></svg>