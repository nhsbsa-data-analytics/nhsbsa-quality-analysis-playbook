<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 658" xml:lang="en-GB" lang="en-GB" role="img" aria-labelledby="diagram-title" aria-describedby="diagram-desc"><title id="diagram-title">When a published figure has changed</title><desc id="diagram-desc">A decision tree. A yellow question at the top left asks: was the change expected. An arrow marked yes goes right to a green box: a revision, expected, not an error. An arrow marked no goes down to a wide blue box: a correction, an error, to be graded by what it does to the conclusions already drawn. Three arrows go down from it to three boxes. Significant, contradicts earlier conclusions: put a prominent alert on the website, correct it as soon as possible, and tell users and stakeholders. Minor but significant, insubstantial but needs correcting now in professional judgement: amend the release and show the revision clearly in it. Minor but insignificant, reasonably deemed inconsequential: correct it at the next scheduled release.</desc><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description><dc:title>When a published figure has changed</dc:title><dc:creator>Seamus Sands</dc:creator><dc:publisher>NHSBSA</dc:publisher><dc:language>en-GB</dc:language></rdf:Description></rdf:RDF></metadata><rect width="680" height="658" fill="#FFFFFF"/><rect x="0" y="0" width="680" height="658" fill="#FFFFFF"/><g opacity="1"><rect x="24" y="22" width="632" height="32" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(24,22)"><foreignObject overflow="visible" x="0" y="0" width="632" height="32"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:flex-start;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><div style="text-align:center"><b style="font-size:20px;color:#003087">When a published figure has changed</b></div></div></div></foreignObject></g></g><g opacity="1"><rect x="24" y="78" width="300" height="100" rx="6" fill="#FFF1D0" stroke="#B07C00" stroke-width="1"/><g transform="translate(24,78)"><foreignObject overflow="visible" x="0" y="0" width="300" height="100"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 14px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center;text-wrap:balance"><b style="font-size:18px;color:#003087">Was the change expected?</b></div></div></div></foreignObject></g></g><g opacity="1"><rect x="424" y="78" width="232" height="100" rx="6" fill="#DCEFE4" stroke="#007F3B" stroke-width="1"/><g transform="translate(424,78)"><foreignObject overflow="visible" x="0" y="0" width="232" height="100"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 14px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center;text-wrap:balance"><b style="font-size:18px;color:#003087">A revision</b><br/><span style="font-size:16px;color:#231F20">Expected. It is not an error.</span></div></div></div></foreignObject></g></g><g opacity="1"><rect x="24" y="262" width="632" height="112" rx="6" fill="#DCE7F5" stroke="#005EB8" stroke-width="1"/><g transform="translate(24,262)"><foreignObject overflow="visible" x="0" y="0" width="632" height="112"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 14px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center;text-wrap:balance"><b style="font-size:18px;color:#003087">A correction</b><br/><span style="font-size:16px;color:#231F20">An error. Grade it by what it does to the conclusions already drawn.</span></div></div></div></foreignObject></g></g><g opacity="1"><rect x="24" y="430" width="200" height="204" rx="6" fill="#DCE7F5" stroke="#005EB8" stroke-width="1"/><g transform="translate(24,430)"><foreignObject overflow="visible" x="0" y="0" width="200" height="204"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:flex-start;padding:16px 8px 0;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center;text-wrap:balance"><b style="font-size:14px;color:#003087;letter-spacing:0.8px">SIGNIFICANT</b><br/><b style="font-size:16px;color:#003087">Contradicts earlier conclusions</b><br/><span style="font-size:16px;color:#231F20">Put a prominent alert on the website. Correct it as soon as possible. Tell users and stakeholders.</span></div></div></div></foreignObject></g></g><g opacity="1"><rect x="240" y="430" width="200" height="204" rx="6" fill="#DCE7F5" stroke="#005EB8" stroke-width="1"/><g transform="translate(240,430)"><foreignObject overflow="visible" x="0" y="0" width="200" height="204"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:flex-start;padding:16px 8px 0;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center;text-wrap:balance"><b style="font-size:14px;color:#003087;letter-spacing:0.8px">MINOR BUT SIGNIFICANT</b><br/><b style="font-size:16px;color:#003087">Insubstantial, but needs correcting now in professional judgement</b><br/><span style="font-size:16px;color:#231F20">Amend the release. Show the revision clearly in it.</span></div></div></div></foreignObject></g></g><g opacity="1"><rect x="456" y="430" width="200" height="204" rx="6" fill="#DCE7F5" stroke="#005EB8" stroke-width="1"/><g transform="translate(456,430)"><foreignObject overflow="visible" x="0" y="0" width="200" height="204"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:flex-start;padding:16px 8px 0;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center;text-wrap:balance"><b style="font-size:14px;color:#003087;letter-spacing:0.8px">MINOR BUT INSIGNIFICANT</b><br/><b style="font-size:16px;color:#003087">Reasonably deemed inconsequential</b><br/><span style="font-size:16px;color:#231F20">Correct it at the next scheduled release.</span></div></div></div></foreignObject></g></g><g opacity="1"><path d="M 324 128 L 324 128 L 424 128 L 424 128" fill="none" stroke="#003087" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 424 128 L 410 133.88 L 410 122.12 Z" fill="#003087"/></g><g transform="translate(352.12,114.4)"><rect x="0" y="0" width="43.76" height="27.2" rx="3" fill="#FFFFFF"/><foreignObject overflow="visible" x="0" y="0" width="43.76" height="27.2"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:16px;color:#425563;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;font-weight:700;">Yes</div></div></foreignObject></g><g opacity="1"><path d="M 174 178 L 174 220 L 174 220 L 174 262" fill="none" stroke="#003087" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 174 262 L 168.12 248 L 179.88 248 Z" fill="#003087"/></g><g transform="translate(157.08,206.4)"><rect x="0" y="0" width="33.84" height="27.2" rx="3" fill="#FFFFFF"/><foreignObject overflow="visible" x="0" y="0" width="33.84" height="27.2"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:16px;color:#425563;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;font-weight:700;">No</div></div></foreignObject></g><g opacity="1"><path d="M 124 374 L 124 402 L 124 402 L 124 430" fill="none" stroke="#003087" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 124 430 L 118.12 416 L 129.88 416 Z" fill="#003087"/></g><g opacity="1"><path d="M 340 374 L 340 402 L 340 402 L 340 430" fill="none" stroke="#003087" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 340 430 L 334.12 416 L 345.88 416 Z" fill="#003087"/></g><g opacity="1"><path d="M 556 374 L 556 402 L 556 402 L 556 430" fill="none" stroke="#003087" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 556 430 L 550.12 416 L 561.88 416 Z" fill="#003087"/></g></svg>