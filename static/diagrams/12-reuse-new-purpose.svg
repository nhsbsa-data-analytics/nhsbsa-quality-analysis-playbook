<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="452" viewBox="0 0 1600 452" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">Reusing analysis for a new purpose</title><desc id="diagram-desc">Reuse tests the assumptions the original was built on. Check four things first</desc><rect width="1600" height="452" fill="#FFFFFF"/><rect x="0" y="0" width="1600" height="452" fill="#FFFFFF"/><g opacity="1"><rect x="40" y="28" width="1520" height="26" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(40,28)"><foreignObject x="0" y="0" width="1520" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:flex-start;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><b style="font-size:20px;color:#003087">Reusing analysis for a new purpose</b></div></div></foreignObject></g></g><g opacity="1"><rect x="40" y="54" width="1520" height="34" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(40,54)"><foreignObject x="0" y="0" width="1520" height="34"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:flex-start;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><span style="font-size:12px;color:#425563">Reuse tests the assumptions the original was built on. Check four things first</span></div></div></foreignObject></g></g><g opacity="1"><rect x="40" y="130" width="359" height="118" rx="6" fill="#DCE7F5" stroke="#005EB8" stroke-width="1"/><g transform="translate(40,130)"><foreignObject x="0" y="0" width="359" height="118"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 14px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center"><b style="font-size:10px;color:#003087;letter-spacing:0.8px">CHECK 1</b><br/><b style="font-size:15px;color:#003087">Population</b><br/><span style="font-size:11px;color:#231F20">Is the new use about different people?</span></div></div></div></foreignObject></g></g><g opacity="1"><rect x="427" y="130" width="359" height="118" rx="6" fill="#DCE7F5" stroke="#005EB8" stroke-width="1"/><g transform="translate(427,130)"><foreignObject x="0" y="0" width="359" height="118"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 14px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center"><b style="font-size:10px;color:#003087;letter-spacing:0.8px">CHECK 2</b><br/><b style="font-size:15px;color:#003087">Data</b><br/><span style="font-size:11px;color:#231F20">Has it moved in coverage, definition or quality since?</span></div></div></div></foreignObject></g></g><g opacity="1"><rect x="814" y="130" width="359" height="118" rx="6" fill="#DCE7F5" stroke="#005EB8" stroke-width="1"/><g transform="translate(814,130)"><foreignObject x="0" y="0" width="359" height="118"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 14px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center"><b style="font-size:10px;color:#003087;letter-spacing:0.8px">CHECK 3</b><br/><b style="font-size:15px;color:#003087">Use case</b><br/><span style="font-size:11px;color:#231F20">Is this outside what the method was built to answer?</span></div></div></div></foreignObject></g></g><g opacity="1"><rect x="1201" y="130" width="359" height="118" rx="6" fill="#DCE7F5" stroke="#005EB8" stroke-width="1"/><g transform="translate(1201,130)"><foreignObject x="0" y="0" width="359" height="118"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 14px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center"><b style="font-size:10px;color:#003087;letter-spacing:0.8px">CHECK 4</b><br/><b style="font-size:15px;color:#003087">Decision context</b><br/><span style="font-size:11px;color:#231F20">Does the output now carry more weight?</span></div></div></div></foreignObject></g></g><g opacity="1"><rect x="40" y="266" width="1520" height="44" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(40,266)"><foreignObject x="0" y="0" width="1520" height="44"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 8px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center"><span style="font-size:11px;color:#425563">Reuse for a new purpose triggers a review at every level above the first.</span></div></div></div></foreignObject></g></g><g opacity="1"><rect x="40" y="322" width="1520" height="78" rx="6" fill="#E8EDEE" stroke="#005EB8" stroke-width="1"/><g transform="translate(40,322)"></g></g><g opacity="1"><rect x="64" y="336" width="1472" height="20" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(64,336)"><foreignObject x="0" y="0" width="1472" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:flex-start;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><b style="font-size:11px;color:#003087;letter-spacing:0.4px">A YES TO ANY OF THEM</b></div></div></foreignObject></g></g><g opacity="1"><rect x="64" y="362" width="1472" height="30" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(64,362)"><foreignObject x="0" y="0" width="1472" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:flex-start;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><span style="font-size:12px;color:#231F20">Score the assurance level again before the reuse goes ahead.</span></div></div></foreignObject></g></g></svg>