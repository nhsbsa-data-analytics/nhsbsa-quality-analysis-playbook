<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="490" viewBox="0 0 1600 490" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">How a lesson gets back to the start</title><desc id="diagram-desc">Two steps in Phase 5, one in Phase 1, and round again</desc><rect width="1600" height="490" fill="#FFFFFF"/><rect x="0" y="0" width="1600" height="490" fill="#FFFFFF"/><g opacity="1"><rect x="40" y="28" width="1520" height="26" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(40,28)"><foreignObject x="0" y="0" width="1520" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:flex-start;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><b style="font-size:20px;color:#003087">How a lesson gets back to the start</b></div></div></foreignObject></g></g><g opacity="1"><rect x="40" y="54" width="1520" height="34" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(40,54)"><foreignObject x="0" y="0" width="1520" height="34"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:flex-start;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><span style="font-size:12px;color:#425563">Two steps in Phase 5, one in Phase 1, and round again</span></div></div></foreignObject></g></g><g opacity="1"><rect x="40" y="130" width="480" height="112" rx="6" fill="#DCE7F5" stroke="#005EB8" stroke-width="1"/><g transform="translate(40,130)"><foreignObject x="0" y="0" width="480" height="112"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 14px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center"><b style="font-size:10px;color:#003087;letter-spacing:0.8px">PHASE 5</b><br/><b style="font-size:15px;color:#003087">Record the lesson</b><br/><span style="font-size:11px;color:#231F20">Put it where the next analyst will look for it.</span></div></div></div></foreignObject></g></g><g opacity="1"><rect x="560" y="130" width="480" height="112" rx="6" fill="#DCE7F5" stroke="#005EB8" stroke-width="1"/><g transform="translate(560,130)"><foreignObject x="0" y="0" width="480" height="112"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 14px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center"><b style="font-size:10px;color:#003087;letter-spacing:0.8px">PHASE 5</b><br/><b style="font-size:15px;color:#003087">Raise it wider</b><br/><span style="font-size:11px;color:#231F20">Anything that applies beyond this one output.</span></div></div></div></foreignObject></g></g><g opacity="1"><rect x="1080" y="130" width="480" height="112" rx="6" fill="#DCE7F5" stroke="#005EB8" stroke-width="1"/><g transform="translate(1080,130)"><foreignObject x="0" y="0" width="480" height="112"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 14px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center"><b style="font-size:10px;color:#003087;letter-spacing:0.8px">PHASE 1</b><br/><b style="font-size:15px;color:#003087">Use it at scoping</b><br/><span style="font-size:11px;color:#231F20">The next piece of work starts from what this one learned.</span></div></div></div></foreignObject></g></g><g opacity="1"><rect x="40" y="304" width="1520" height="44" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(40,304)"><foreignObject x="0" y="0" width="1520" height="44"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 8px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center"><span style="font-size:11px;color:#425563">Capture lessons as they happen, not by reconstructing them at the end.</span></div></div></div></foreignObject></g></g><g opacity="1"><rect x="40" y="360" width="1520" height="78" rx="6" fill="#E8EDEE" stroke="#005EB8" stroke-width="1"/><g transform="translate(40,360)"></g></g><g opacity="1"><rect x="64" y="374" width="1472" height="20" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(64,374)"><foreignObject x="0" y="0" width="1472" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:flex-start;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><b style="font-size:11px;color:#003087;letter-spacing:0.4px">WHERE IT IS WRITTEN DOWN</b></div></div></foreignObject></g></g><g opacity="1"><rect x="64" y="400" width="1472" height="30" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(64,400)"><foreignObject x="0" y="0" width="1472" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:flex-start;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><span style="font-size:12px;color:#231F20">The review record sits with the project record, which for most outputs is a short entry in the analytical plan.</span></div></div></foreignObject></g></g><g opacity="1"><path d="M 520 186 L 520 186 L 560 186 L 560 186" fill="none" stroke="#003087" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 560 186 L 546 191.88 L 546 180.12 Z" fill="#003087"/></g><g opacity="1"><path d="M 1040 186 L 1040 186 L 1080 186 L 1080 186" fill="none" stroke="#003087" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1080 186 L 1066 191.88 L 1066 180.12 Z" fill="#003087"/></g><g opacity="1"><path d="M 1320 242 L 1320 280 Q 1320 288 1312 288 L 288 288 Q 280 288 280 280 L 280 242" fill="none" stroke="#007F3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 280 242 L 285.88 256 L 274.12 256 Z" fill="#007F3B"/></g></svg>