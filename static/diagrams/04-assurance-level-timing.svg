<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 600" xml:lang="en-GB" lang="en-GB" role="img" aria-labelledby="diagram-title" aria-describedby="diagram-desc"><title id="diagram-title">When each step happens</title><desc id="diagram-desc">A grid of two lanes and four phases. The phases run across the top: engagement and scoping, design, analysis, and delivery and sign-off. The top lane is work where no impact dimension scores Level 4. Step 1, score the impact, is in engagement and scoping. Step 2, score the likelihood, and step 3, read your level, are in design. Step 4, do what your level requires, runs from design to the end of delivery and sign-off. The lower lane is work where an impact dimension scores Level 4, which is Business Critical. Steps 1, 2 and 3 are all in engagement and scoping, and step 4 runs from there to the end of delivery and sign-off.</desc><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description><dc:title>When each step happens</dc:title><dc:creator>Seamus Sands</dc:creator><dc:publisher>NHSBSA</dc:publisher><dc:language>en-GB</dc:language></rdf:Description></rdf:RDF></metadata><rect width="680" height="600" fill="#FFFFFF"/><rect x="0" y="0" width="680" height="600" fill="#FFFFFF"/><g opacity="1"><rect x="24" y="22" width="632" height="32" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(24,22)"><foreignObject overflow="visible" x="0" y="0" width="632" height="32"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:flex-start;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><div style="text-align:center"><b style="font-size:20px;color:#003087">When each step happens</b></div></div></div></foreignObject></g></g><g opacity="1"