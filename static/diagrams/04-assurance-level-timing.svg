-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center;text-wrap:balance"><b style="font-size:14px;color:#FFFFFF;letter-spacing:0.8px">PHASE 3</b><br/><b style="font-size:14px;color:#FFFFFF">Analysis</b></div></div></div></foreignObject></g></g><g opacity="1"><rect x="533" y="78" width="123" height="60" rx="6" fill="#003087" stroke="#003087" stroke-width="1"/><g transform="translate(533,78)"><foreignObject overflow="visible" x="0" y="0" width="123" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 6px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center;text-wrap:balance"><b style="font-size:14px;color:#FFFFFF;letter-spacing:0.8px">PHASE 4</b><br/><b style="font-size:14px;color:#FFFFFF">Delivery and sign-off</b></div></div></div></foreignObject></g></g><g opacity="1"><rect x="24" y="150" width="108" height="172" rx="0" fill="#E8EDEE" stroke="none" stroke-width="1"/><g transform="translate(24,150)"><foreignObject overflow="visible" x="0" y="0" width="108" height="172"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:center;padding:0 4px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><div style="text-align:left"><b style="font-size:14px;color:#003087">No impact dimension scores Level 4</b></div></div></div></foreignObject></g></g><g opacity="1"><rect x="140" y="150" width="123" height="52" rx="6" fill="#DCE7F5" stroke="#005EB8" stroke-width="1"/><g transform="translate(140,150)"><foreignObject overflow="visible" x="0" y="0" width="123" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style