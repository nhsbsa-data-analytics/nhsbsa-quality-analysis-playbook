<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">Does the playbook apply to this at all?</title><desc id="diagram-desc">Two questions. If both are yes, it applies.</desc><rect width="1600" height="560" fill="#FFFFFF"/><rect x="0" y="0" width="1600" height="560" fill="#FFFFFF"/><g opacity="1"><rect x="40" y="28" width="1520" height="26" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(40,28)"><foreignObject x="0" y="0" width="1520" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:flex-start;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><b style="font-size:20px;color:#003087">Does the playbook apply to this at all?</b></div></div></foreignObject></g></g><g opacity="1"><rect x="40" y="54" width="1520" height="34" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(40,54)"><foreignObject x="0" y="0" width="1520" height="34"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:flex-start;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><span style="font-size:12px;color:#425563">Two questions. If both are yes, it applies.</span></div></div></foreignObject></g></g><g opacity="1"><rect x="40" y="130" width="480" height="112" rx="6" fill="#DCE7F5" stroke="#005EB8" stroke-width="1"/><g transform="translate(40,130)"><foreignObject x="0" y="0" width="480" height="112"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 14px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center"><b style="font-size:10px;color:#003087;letter-spacing:0.8px">QUESTION 1</b><br/><b style="font-size:15px;color:#003087">Did you work with data?</b><br/><span style="font-size:11px;color:#231F20">You collected, manipulated or interpreted it to answer a question.</span></div></div></div></foreignObject></g></g><g opacity="1"><rect x="560" y="130" width="480" height="112" rx="6" fill="#DCE7F5" stroke="#005EB8" stroke-width="1"/><g transform="translate(560,130)"><foreignObject x="0" y="0" width="480" height="112"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 14px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center"><b style="font-size:10px;color:#003087;letter-spacing:0.8px">QUESTION 2</b><br/><b style="font-size:15px;color:#003087">Will anyone act on the answer?</b></div></div></div></foreignObject></g></g><g opacity="1"><rect x="1080" y="130" width="480" height="112" rx="6" fill="#DCEFE4" stroke="#007F3B" stroke-width="1"/><g transform="translate(1080,130)"><foreignObject x="0" y="0" width="480" height="112"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 14px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center"><b style="font-size:10px;color:#003087;letter-spacing:0.8px">BOTH YES</b><br/><b style="font-size:15px;color:#003087">The playbook applies</b><br/><span style="font-size:11px;color:#231F20">How much assurance it needs is the next question.</span></div></div></div></foreignObject></g></g><g opacity="1"><rect x="560" y="310" width="480" height="80" rx="6" fill="#FFFFFF" stroke="#768692" stroke-width="1"/><g transform="translate(560,310)"><foreignObject x="0" y="0" width="480" height="80"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 14px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center"><b style="font-size:10px;color:#003087;letter-spacing:0.8px">EITHER NO</b><br/><b style="font-size:15px;color:#003087">The playbook does not apply</b></div></div></div></foreignObject></g></g><g opacity="1"><rect x="40" y="430" width="1520" height="78" rx="6" fill="#E8EDEE" stroke="#005EB8" stroke-width="1"/><g transform="translate(40,430)"></g></g><g opacity="1"><rect x="64" y="444" width="1472" height="20" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(64,444)"><foreignObject x="0" y="0" width="1472" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:flex-start;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><b style="font-size:11px;color:#003087;letter-spacing:0.4px">THE TEST, NOT THE EXAMPLES</b></div></div></foreignObject></g></g><g opacity="1"><rect x="64" y="470" width="1472" height="30" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(64,470)"><foreignObject x="0" y="0" width="1472" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:flex-start;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><span style="font-size:12px;color:#231F20">These two questions decide it, not a list of examples.</span></div></div></foreignObject></g></g><g opacity="1"><path d="M 520 186 L 520 186 L 560 186 L 560 186" fill="none" stroke="#003087" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 560 186 L 546 191.88 L 546 180.12 Z" fill="#003087"/></g><g transform="translate(523.7,177.5)"><rect x="0" y="0" width="32.6" height="17" rx="3" fill="#FFFFFF"/><foreignObject x="0" y="0" width="32.6" height="17"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:10px;color:#425563;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;">yes</div></div></foreignObject></g><g opacity="1"><path d="M 1040 186 L 1040 186 L 1080 186 L 1080 186" fill="none" stroke="#003087" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1080 186 L 1066 191.88 L 1066 180.12 Z" fill="#003087"/></g><g transform="translate(1043.7,177.5)"><rect x="0" y="0" width="32.6" height="17" rx="3" fill="#FFFFFF"/><foreignObject x="0" y="0" width="32.6" height="17"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:10px;color:#425563;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;">yes</div></div></foreignObject></g><g opacity="1"><path d="M 280 242 L 280 288 Q 280 296 288 296 L 552 296 Q 560 296 560 304 L 560 350" fill="none" stroke="#768692" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><path d="M 560 350 L 554.12 336 L 565.88 336 Z" fill="#768692"/></g><g transform="translate(406.8,287.5)"><rect x="0" y="0" width="26.4" height="17" rx="3" fill="#FFFFFF"/><foreignObject x="0" y="0" width="26.4" height="17"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:10px;color:#425563;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;">no</div></div></foreignObject></g><g opacity="1"><path d="M 800 242 L 800 276 L 800 276 L 800 310" fill="none" stroke="#768692" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><path d="M 800 310 L 794.12 296 L 805.88 296 Z" fill="#768692"/></g><g transform="translate(786.8,267.5)"><rect x="0" y="0" width="26.4" height="17" rx="3" fill="#FFFFFF"/><foreignObject x="0" y="0" width="26.4" height="17"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:10px;color:#425563;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;">no</div></div></foreignObject></g></svg>