<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="618" viewBox="0 0 1600 618" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">Correcting a published figure</title><desc id="diagram-desc">Grade it by what it does to the conclusion, not by how big the number is</desc><rect width="1600" height="618" fill="#FFFFFF"/><rect x="0" y="0" width="1600" height="618" fill="#FFFFFF"/><g opacity="1"><rect x="40" y="28" width="1520" height="26" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(40,28)"><foreignObject x="0" y="0" width="1520" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:flex-start;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><b style="font-size:20px;color:#003087">Correcting a published figure</b></div></div></foreignObject></g></g><g opacity="1"><rect x="40" y="54" width="1520" height="34" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(40,54)"><foreignObject x="0" y="0" width="1520" height="34"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:flex-start;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><span style="font-size:12px;color:#425563">Grade it by what it does to the conclusion, not by how big the number is</span></div></div></foreignObject></g></g><g opacity="1"><rect x="40" y="130" width="740" height="100" rx="6" fill="#DCEFE4" stroke="#007F3B" stroke-width="1"/><g transform="translate(40,130)"><foreignObject x="0" y="0" width="740" height="100"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 14px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center"><b style="font-size:10px;color:#003087;letter-spacing:0.8px">NOT AN ERROR</b><br/><b style="font-size:15px;color:#003087">A revision</b><br/><span style="font-size:11px;color:#231F20">Provisional figures finalised, a change of method, or more data.</span></div></div></div></foreignObject></g></g><g opacity="1"><rect x="820" y="130" width="740" height="100" rx="6" fill="#F8DEDC" stroke="#DA291C" stroke-width="1"/><g transform="translate(820,130)"><foreignObject x="0" y="0" width="740" height="100"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 14px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center"><b style="font-size:10px;color:#003087;letter-spacing:0.8px">AN ERROR</b><br/><b style="font-size:15px;color:#003087">A correction</b><br/><span style="font-size:11px;color:#231F20">Something published was wrong. It gets graded.</span></div></div></div></foreignObject></g></g><g opacity="1"><rect x="40" y="300" width="485" height="118" rx="6" fill="#DCE7F5" stroke="#005EB8" stroke-width="1"/><g transform="translate(40,300)"><foreignObject x="0" y="0" width="485" height="118"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 10px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center"><b style="font-size:10px;color:#003087;letter-spacing:0.8px">IT CHANGES THE CONCLUSION</b><br/><b style="font-size:15px;color:#003087">Significant</b><br/><span style="font-size:11px;color:#231F20">Alert on the website, corrected as soon as possible, and users told.</span></div></div></div></foreignObject></g></g><g opacity="1"><rect x="557" y="300" width="485" height="118" rx="6" fill="#DCE7F5" stroke="#005EB8" stroke-width="1"/><g transform="translate(557,300)"><foreignObject x="0" y="0" width="485" height="118"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 10px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center"><b style="font-size:10px;color:#003087;letter-spacing:0.8px">WORTH FIXING NOW</b><br/><b style="font-size:15px;color:#003087">Minor but significant</b><br/><span style="font-size:11px;color:#231F20">The release is amended, and the change is identified in it.</span></div></div></div></foreignObject></g></g><g opacity="1"><rect x="1074" y="300" width="485" height="118" rx="6" fill="#DCE7F5" stroke="#005EB8" stroke-width="1"/><g transform="translate(1074,300)"><foreignObject x="0" y="0" width="485" height="118"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 10px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center"><b style="font-size:10px;color:#003087;letter-spacing:0.8px">NOTHING TURNS ON IT</b><br/><b style="font-size:15px;color:#003087">Minor and insignificant</b><br/><span style="font-size:11px;color:#231F20">Corrected at the next scheduled release.</span></div></div></div></foreignObject></g></g><g opacity="1"><rect x="40" y="432" width="1520" height="44" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(40,432)"><foreignObject x="0" y="0" width="1520" height="44"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:center;align-items:center;padding:0 8px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:center;overflow-wrap:break-word;width:100%;"><div style="text-align:center"><span style="font-size:11px;color:#425563">Only a correction is graded. A revision is not an error.</span></div></div></div></foreignObject></g></g><g opacity="1"><rect x="40" y="488" width="1520" height="78" rx="6" fill="#E8EDEE" stroke="#005EB8" stroke-width="1"/><g transform="translate(40,488)"></g></g><g opacity="1"><rect x="64" y="502" width="1472" height="20" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(64,502)"><foreignObject x="0" y="0" width="1472" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:flex-start;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><b style="font-size:11px;color:#003087;letter-spacing:0.4px">WHO DECIDES</b></div></div></foreignObject></g></g><g opacity="1"><rect x="64" y="528" width="1472" height="30" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(64,528)"><foreignObject x="0" y="0" width="1472" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:flex-start;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><span style="font-size:12px;color:#231F20">For official statistics the Lead Official for Statistics decides, and the amendment is published.</span></div></div></foreignObject></g></g><g opacity="1"><path d="M 1190 230 L 1190 257 Q 1190 265 1182 265 L 290 265 Q 282 265 282.114 272.999 L 282.5 300" fill="none" stroke="#003087" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 282.5 300 L 276.421 286.085 L 288.179 285.917 Z" fill="#003087"/></g><g opacity="1"><path d="M 1190 230 L 1190 257 Q 1190 265 1182 265 L 807 265 Q 799 265 799.114 272.999 L 799.5 300" fill="none" stroke="#003087" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 799.5 300 L 793.421 286.085 L 805.179 285.917 Z" fill="#003087"/></g><g opacity="1"><path d="M 1190 230 L 1190 257 Q 1190 265 1198 265 L 1308 265 Q 1316 265 1316.11 272.999 L 1316.5 300" fill="none" stroke="#003087" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1316.5 300 L 1310.42 286.085 L 1322.18 285.917 Z" fill="#003087"/></g></svg>