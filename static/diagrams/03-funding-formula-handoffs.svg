<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 768" xml:lang="en-GB" lang="en-GB" role="img" aria-labelledby="diagram-title" aria-describedby="diagram-desc"><title id="diagram-title">Seven handoffs between four roles</title><desc id="diagram-desc">An illustration, not a real NHSBSA case: a sequence of seven handoffs between four roles, read from the top down. The four roles run across the top, each with a vertical line below: commissioner, analyst, critical friend, and Analysis Senior Responsible Officer. A dark heading down the left names the phase each handoff falls in. 1, in engagement and scoping: the commissioner passes the analyst the decision, the deadline and how certain the answer has to be. 2, in design: the analyst passes the critical friend the design and plan, with the critical friend named on it. 3, in analysis: the critical friend passes the analyst findings, which are the analyst&#x27;s to act on. 4, 5, 6 and 7 are all in delivery, communication and sign-off. 4: the analyst passes the commissioner draft results, so they are understood before sign-off. 5: the analyst passes the Analysis Senior Responsible Officer the assurance evidence. 6: the critical friend passes the Analysis Senior Responsible Officer the Lead Assurer sign-off, which comes before the approval. 7: the Analysis Senior Responsible Officer passes the commissioner the approval, as fit for its intended use. The example is a funding allocation formula at Level 4.</desc><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description><dc:title>Seven handoffs between four roles</dc:title><dc:creator>Seamus Sands</dc:creator><dc:publisher>NHSBSA</dc:publisher><dc:language>en-GB</dc:language></rdf:Description></rdf:RDF></metadata><rect width="680" height="768" fill="#FFFFFF"/><rect x="0" y="0" width="680" height="768" fill="#FFFFFF"/><g opacity="1"><rect x="24" y="22" width="632" height="32" rx="0" fill="none" s