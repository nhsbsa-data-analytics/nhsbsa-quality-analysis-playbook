<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 416" xml:lang="en-GB" lang="en-GB" role="img" aria-labelledby="diagram-title" aria-describedby="diagram-desc"><title id="diagram-title">How impact and likelihood give your level</title><desc id="diagram-desc">A grid with likelihood across the top, from 1 low to 4 very high, and impact down the side, from 4 very high at the top to 1 low at the bottom. Where cells side by side give the same level they are drawn as one. Impact 4 is Level 4 BCA at every likelihood. Impact 3 is Level 1 Standard at likelihood 1, Level 2 Enhanced at 2, and Level 3 Comprehensive at 3 and 4. Impact 2 is Level 1 Standard at likelihood 1, Level 2 Enhanced at 2 and 3, and Level 3 Comprehensive at 4. Impact 1 is Level 1 Standard at likelihood 1 to 3, and Level 2 Enhanced at 4.</desc><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description><dc:title>How impact and likelihood give your level</dc:title><dc:creator>Seamus Sands</dc:creator><dc:publisher>NHSBSA</dc:publisher><dc:language>en-GB</dc:language></rdf:Description></rdf:RDF></metadata><rect width="680" height="416" fill="#FFFFFF"/><rect x="0" y="0" width="680" height="416" fill="#FFFFFF"/><g opacity="1"><rect x="24" y="22" width="632" height="32" rx="0" fill="none" stroke="none" stroke-width="1"/><g transform="translate(24,22)"><foreignObject overflow="visible" x="0" y="0" width="632" height="32"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;box-sizing:border-box;justify-content:flex-start;align-items:flex-start;padding:0 0px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#231F20;line-height:1.25;text-align:left;overflow-wrap:break-word;width:100%;"><div style="text-align:center"><b style="font-size:20px;color:#003087">How impact and likelihood give your level</b></div></div></div></foreignObject></g></g><g opacity="1"><rect x="136" y="78" wi